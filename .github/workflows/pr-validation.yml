name: PR Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install All Dependencies
        run: npm install

      - name: Check Site Integrity
        # Verifies every deployable app is consistently wired (build
        # script, unique slug, matching vite base path, landing card)
        run: npm run check:site

      - name: TypeScript Type Check
        # Runs each workspace's typecheck script
        run: npm run typecheck

      - name: Lint and Test (Workspaces)
        run: |
          npm run lint -ws --if-present
          npm run test -ws --if-present

      - name: Build Site
        # Builds every deployable app and assembles _site/ exactly like
        # the deploy workflow does
        run: npm run build:site

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: _site
          retention-days: 7
